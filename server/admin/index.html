<!doctype html>
<html lang="en" data-radius="sharp">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>unsyk admin</title>
<meta name="description" content="Admin console for unsyk: testing (A/B results, build health, sessions) and players (who is online, stats, licenses, configs).">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' rx='1.5' transform='rotate(45 8 8)' fill='%231f2de6'/%3E%3Crect x='6.5' y='6.5' width='3' height='3' transform='rotate(45 8 8)' fill='%23eef0f3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400..700&family=Figtree:wght@400..600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/app.css">
<script src="/admin/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<!-- sign in -->
<div class="signin" id="signin" hidden>
  <form class="signin-card" id="signin-form" autocomplete="on" novalidate>
    <div class="mark mark--lg" aria-hidden="true"><i></i></div>
    <h1>Sign in to unsyk admin</h1>
    <p class="muted">Password and the 6-digit code from your authenticator app.</p>
    <label class="field"><span>User</span><input name="user" id="si-user" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input name="password" id="si-pass" type="password" autocomplete="current-password" required></label>
    <label class="field"><span>Authenticator code</span><input name="code" id="si-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required></label>
    <p class="form-error" id="si-err" role="alert"></p>
    <button class="btn btn--primary btn--block" type="submit" id="si-go">Sign in</button>
    <p class="fine muted">5 wrong tries lock this address for 15 minutes. Codes work once.</p>
  </form>
</div>

<!-- app -->
<div class="app" id="app" hidden>
  <aside class="side" id="side">
    <div class="side-top">
      <a class="brand" href="#t/compare"><span class="mark" aria-hidden="true"><i></i></span><span>unsyk</span><em>admin</em></a>
      <button class="icon-btn side-close" id="side-close" aria-label="Close menu">&times;</button>
    </div>
    <div class="ws" role="tablist" aria-label="Workspace">
      <a href="#t/compare" role="tab" data-ws="t" id="ws-t"><span class="ico ico-flask"></span>Testing</a>
      <a href="#p/players" role="tab" data-ws="p" id="ws-p"><span class="ico ico-people"></span>Players</a>
    </div>
    <nav class="side-nav" id="side-nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <div class="who"><span class="dot" id="feed-dot"></span><span id="who">admin</span></div>
      <div class="side-actions">
        <button class="link-btn" id="theme" type="button">Theme</button>
        <button class="link-btn" id="signout" type="button">Sign out</button>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main" tabindex="-1">
    <header class="top">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false"><span></span></button>
      <div class="top-title"><h1 id="page-title">unsyk admin</h1><p id="page-sub" class="muted"></p></div>
      <div class="top-tools" id="top-tools"></div>
    </header>
    <div class="fbar" id="fbar" hidden></div>
    <div class="page" id="page"></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog class="dlg" id="dlg"></dialog>
</body>
</html>
