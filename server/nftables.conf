#!/usr/sbin/nft -f
# Firewall for pve2 CT 115 (hvh-ingest), installed as /etc/nftables.conf.
# Own table only, NO "flush ruleset": that would also wipe Tailscale's iptables-nft rules on a reload.
# Apply:  nft -c -f /etc/nftables.conf && nft -f /etc/nftables.conf   (nftables.service loads it at boot)
#
# wg0        only Caddy on the VPS (10.8.0.1) may reach the public receiver (8787); nothing else, not even SSH.
# tailscale0 the admin panel (8080) only from the devices in @panel_ts (personal devices, not servers or tagged
#            devices). New laptop/phone: add its 100.x address here and reload.
# eth0       the admin panel only from the home LAN.
table inet hvh
delete table inet hvh

table inet hvh {
	set panel_ts {
		type ipv4_addr
		# MacBook Pro, iPhone, Redmi Note 13 Pro, DESKTOP-7AEFQG5, cachyos
		elements = { 100.99.181.40, 100.102.36.118, 100.106.207.22, 100.71.33.100, 100.86.232.110 }
	}

	chain input {
		type filter hook input priority filter - 10; policy accept;
		iif "lo" accept
		ct state established,related accept

		iifname "wg0" ip saddr 10.8.0.1 tcp dport 8787 accept
		iifname "wg0" counter drop

		tcp dport 22 drop

		iifname "tailscale0" tcp dport 8080 ip saddr @panel_ts accept
		iifname "tailscale0" tcp dport 8080 counter drop

		iifname "eth0" tcp dport 8080 ip saddr 192.168.68.0/22 accept
		iifname "eth0" tcp dport 8080 counter drop
	}
}
